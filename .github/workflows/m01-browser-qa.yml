name: M01 preserved-UI Chromium smoke QA

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium desktop, mobile and synthetic A4 print
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned browser automation
        run: npm ci
      - name: Install isolated Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Run original UI in real browser with fail-closed RPC fixture
        run: npm run test:m01:browser
      - name: Install pinned local-only Workerd test runtime
        run: npm install --no-save --package-lock=false wrangler@4.161.0
      - name: Test original browser Day Book RPC against isolated Workerd D1
        run: node --test qa/m01-daybook-local-d1.spec.mjs
      - name: Test original Chromium login and logout on isolated real M04 D1
        run: node --test qa/m01-auth-browser-local-d1.spec.mjs
      - name: Keep synthetic evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-browser-evidence
          path: test-results/m01-browser/
          retention-days: 7
          if-no-files-found: warn