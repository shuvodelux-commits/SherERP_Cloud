name: M02 Legacy error logs schema/import real local Workerd D1

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  logs-local-d1:
    name: Verify frozen error-log schema and atomic import using local D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install fixed local Wrangler for Workerd
        run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.161.0
      - name: Validate source contract and SQLite STRICT DDL
        run: node --test tests/m02-legacy-error-logs-schema.test.mjs tests/m02-legacy-error-logs-import.test.mjs
      - name: Verify atomic source import, duplicates, replay and readback on actual local D1
        run: node --test tests/integration/m02-legacy-error-logs-workerd.spec.mjs
