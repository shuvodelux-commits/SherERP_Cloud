name: Foundation source checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  m00-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test audit, SQL constraints and import guards
        run: npm test
      - name: Verify source byte-for-byte against pinned manifest
        run: npm run verify:source
      - name: Verify source-faithful schema inventory
        run: |
          npm run inventory:schema --silent > /tmp/m02-schema.json
          cmp -s docs/baseline/schema-inventory.json /tmp/m02-schema.json
          node -e "const s=require('/tmp/m02-schema.json'); const n=s.tables.reduce((a,t)=>a+t.columns.length,0); if(s.tables.length!==49 || n!==659) process.exit(1); console.log('M02 groups and columns:',s.tables.length,n)"
      - name: Verify reviewed catalog map against frozen Config.gs
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {verifyCatalogMapping} from './src/db/catalog-mapping.js'; verifyCatalogMapping(JSON.parse(readFileSync('docs/baseline/schema-inventory.json','utf8'))); console.log('Catalog column mapping matches original source')"
      - name: Verify Party legacy mapping against the full frozen source inventory
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {validatePartyContracts} from './src/party/legacy-contracts.js'; const source=JSON.parse(readFileSync('docs/baseline/schema-inventory.json','utf8')); validatePartyContracts(source); console.log('Party source masters and related groups verified')"
      - name: Test source-safe Party identity import proposals (no database writes)
        run: |
          npm run party:dry-run --silent -- tests/fixtures/party-import.synthetic.json > /tmp/party-proposal.json
          npm run party:dry-run --silent -- tests/fixtures/party-import.synthetic.json tests/fixtures/party-approved.synthetic.json > /tmp/party-reviewed.json
          node -e "const fs=require('node:fs'); const a=fs.readFileSync('/tmp/party-proposal.json','utf8'); const b=JSON.parse(fs.readFileSync('/tmp/party-reviewed.json','utf8')); const p=JSON.parse(a); if(p.proposedParties!==5 || p.pendingIdentityReviews!==2 || b.proposedParties!==4 || b.reviewedGroups!==1 || a.includes('01700000000') || a.includes('Rahim')) process.exit(1); console.log('Party dry-run guarded proposals:',p.proposedParties,b.proposedParties)"
      - name: Run synthetic catalog import dry-run (no database writes)
        run: |
          npm run catalog:dry-run --silent -- tests/fixtures/catalog-synthetic.json > /tmp/m02-catalog-dryrun.json
          node -e "const r=require('/tmp/m02-catalog-dryrun.json'); if(r.totalRows!==4 || r.groups.length!==3) process.exit(1); console.log('Synthetic dry-run rows:',r.totalRows)"
      - name: Run deterministic source audit
        run: |
          npm run audit --silent > /tmp/m00-audit.json
          node -e "const f=require('/tmp/m00-audit.json'); if(f.totals.backendFiles!==47 || f.totals.frontendFiles!==37 || f.totals.files!==84) process.exit(1); console.log('M00 audit:', f.totals)"
