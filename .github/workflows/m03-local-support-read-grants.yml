name: M03 local read-only support grants on two disposable D1s

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  support-read-grants:
    name: M03 support read-only session isolation, auth and immutable audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned disposable local Workerd and D1 runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.161.0
      - name: Verify real two-Shop D1 support-read security boundary
        run: node --test tests/integration/m03-local-support-read-grants-workerd.spec.mjs
