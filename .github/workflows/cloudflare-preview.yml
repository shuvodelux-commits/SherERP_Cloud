name: Cloudflare Workers Builds — pull request safety checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Verify source, Worker and safe preview configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original source and Worker contracts
        run: |
          npm test
          npm run verify:source
      - name: Build unchanged HTML with HTTP RPC adapter
        run: npm run build:frontend
      - name: Reject public database bindings in PR previews
        run: |
          node scripts/check-cloudflare-preview.mjs wrangler.preview.jsonc
          node scripts/check-staging-d1.mjs wrangler.staging.jsonc wrangler.preview.jsonc
      - name: Bundle Worker without publishing or credentials
        run: npx --yes wrangler@4.161.0 deploy --dry-run --config wrangler.preview.jsonc
