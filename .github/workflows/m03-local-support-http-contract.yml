name: M03 local private support HTTP contract Workerd D1

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  private-support-http:
    name: M03 private support HTTP Shop isolation and audit (local-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned local-only Workerd
        run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.161.0
      - name: Test local private HTTP auth contract and existing grant/diagnostic regression
        run: node --test tests/integration/m03-local-support-http-contract-workerd.spec.mjs tests/integration/m03-local-support-read-grants-workerd.spec.mjs tests/integration/m03-local-support-shop-diagnostics-workerd.spec.mjs
