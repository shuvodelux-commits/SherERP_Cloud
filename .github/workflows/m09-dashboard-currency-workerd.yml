name: M09 Dashboard currency authorized local Workerd D1 (no public binding)

on:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard-currency:
    name: Verify Dashboard currency against isolated Workerd D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check original-source unit and D1 authorization suite
        run: npm test
      - name: Install pinned Wrangler in test runner only
        run: npm install --no-save --package-lock=false wrangler@4.161.0
      - name: Test Dashboard currency against isolated local Workerd D1
        run: node --test tests/integration/m09-authorized-dashboard-currency-workerd.spec.mjs
