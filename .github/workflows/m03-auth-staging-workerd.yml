name: M03 Auth-only staging Worker — isolated Workerd/D1

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  staged-auth-only:
    name: Stage Administrator login against synthetic Workerd/D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install disposable real Workerd/D1
        run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.161.0
      - name: Verify private staging login, shell and no business RPC
        run: >-
          node --test --test-concurrency=1
          tests/integration/m03-staging-auth-runtime-workerd.spec.mjs
          tests/integration/m04-google-session-flow-workerd.spec.mjs
      - name: Verify separate shop bindings in local Workerd
        run: node --test tests/integration/m03-tenant-binding-pilot-workerd.spec.mjs
      - name: Verify one-time platform Super Admin bootstrap on local D1
        run: node --test tests/integration/m04-platform-superadmin-bootstrap-workerd.spec.mjs
      - name: Verify platform MFA and revocable sessions on local D1
        run: node --test tests/integration/m04-platform-superadmin-session-workerd.spec.mjs
      - name: Verify private platform browser authentication on local D1
        run: node --test tests/integration/m04-platform-browser-auth-workerd.spec.mjs
      - name: Verify private platform assets and local Control D1 migrations
        run: node --test tests/integration/m03-platform-auth-release-local.spec.mjs
      - name: Verify Access-gated workers.dev candidate without deployment
        run: |
          node --test tests/m03-platform-access-workers-dev.test.mjs tests/integration/m03-platform-access-release-local.spec.mjs
          npx --no-install wrangler deploy --dry-run --config wrangler.m03-platform-auth-access-staging.jsonc --outdir .wrangler-m03-platform-access
      - name: Build preserved source UI without modifying it
        run: npm run build:frontend
      - name: Compile exact auth staging candidate without deployment
        run: npx --no-install wrangler deploy --dry-run --config wrangler.m03-auth-staging.jsonc --outdir .wrangler-m03-auth-staging
      - name: Compile the opt-in Google staging UI
        run: node scripts/build-staging-google-ui.mjs dist dist-google-staging
      - name: Compile the Google staging candidate without deployment
        run: npx --no-install wrangler deploy --dry-run --config wrangler.m03-google-auth-staging.jsonc --outdir .wrangler-m03-google-auth-staging
