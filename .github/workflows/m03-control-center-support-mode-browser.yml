name: M03 private Control Center Support Mode Chromium (local D1)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  private-support-ui:
    name: M03 Support Mode no-deploy gates, local Chromium and two-Shop D1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Install pinned disposable Workerd
        run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.161.0
      - name: Verify Support Mode hidden by default, gated local start read end and original directory
        run: node --test qa/m03-control-center-support-mode.spec.mjs qa/m03-control-center-provisioning-page.spec.mjs
