name: M03 local Cash Session lifecycle real Workerd D1 (no deployment)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-cash-session-workerd:
    name: M03 local-only Start Close Resume and authenticated SQL cash gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install disposable Workerd runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.161.0
      - name: Run M03 local-only Cash Session lifecycle real Workerd/D1
        run: node --test tests/integration/m03-local-cash-session-workerd.spec.mjs
