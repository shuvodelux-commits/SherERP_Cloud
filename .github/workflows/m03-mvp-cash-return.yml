name: M03 MVP operational Cash Return — private Workerd D1 only

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  owner-cash-return:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.161.0
      - name: Original Purchase, POS Sale and Cash Return — real two-Shop local Workerd D1
        run: node --test tests/integration/m03-mvp-cash-return-workerd.spec.mjs
      - name: Install Chromium for preserved original Returns UI
        run: npx playwright install --with-deps chromium
      - name: Original Returns browser -> authenticated real Shop D1 Cash refund
        run: node --test qa/m03-mvp-cash-return-browser.spec.mjs
      - name: Existing operational FIFO Cash Sale regression
        run: node --test tests/integration/m03-mvp-cash-sale-workerd.spec.mjs
      - name: Owner source frontend integration compiler
        run: npm run build:owner-frontend
