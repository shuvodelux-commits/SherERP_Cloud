name: M02 reviewed Party evidence real local D1 (read-only adapter)

on:
  pull_request:

permissions:
  contents: read

jobs:
  m02-party-evidence-d1:
    name: Source-gated reviewed Party readback against isolated workerd D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked project test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Wrangler for isolated Workerd/D1
        run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.161.0
      - name: Verify source-gated evidence with real ephemeral local D1
        run: node --test tests/integration/m02-reviewed-evidence-workerd.spec.mjs
