name: M03 Worker-runtime D1 integration (local-only)

on:
  pull_request:

permissions:
  contents: read

jobs:
  local-worker-d1:
    name: Test read-only adapters against local workerd and D1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify repository and test-only Worker isolation policy
        run: npm test
      - name: Install pinned Wrangler only in this isolated CI runner
        run: npm install --no-save --package-lock=false wrangler@4.161.0
      - name: Run actual local workerd/D1 adapter integration
        run: |
          node --test tests/integration/m03-workerd.spec.mjs
          node --test tests/integration/m03-daybook-rpc-workerd.spec.mjs
          node --test tests/integration/m03-daybook-http-workerd.spec.mjs
          node --test tests/integration/m03-expense-category-read-workerd.spec.mjs
          node --test tests/integration/m03-invoice-edit-audit-read-workerd.spec.mjs