name: M03 Worker-runtime D1 integration (local-only)
on:
  pull_request:
permissions:
  contents: read

jobs:
  verify-repo:
    name: Verify repository and test-only Worker isolation policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete Node/source isolation regression
        run: npm test

  workerd-shards:
    name: "Local Workerd/D1 exact coverage (${{ matrix.group }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: shard-1
            specs: >-
              tests/integration/m03-workerd-core.spec.mjs
              tests/integration/m04-atomic-authority-workerd.spec.mjs
              tests/integration/m03-authorized-receipt-workerd.spec.mjs
              tests/integration/m03-catalog-update-workerd.spec.mjs
              tests/integration/m03-id-issuer-workerd.spec.mjs
              tests/integration/m07-store-credit-workerd.spec.mjs
              tests/integration/m07-purchase-supplier-credit-workerd.spec.mjs
              tests/integration/m07-purchase-multilot-cash-workerd.spec.mjs
              tests/integration/m03-expense-payee-party-proof-workerd.spec.mjs
          - group: shard-2
            specs: >-
              tests/integration/m04-auth-http-workerd.spec.mjs
              tests/integration/m04-session-workerd.spec.mjs
              tests/integration/m03-m04-receipt-workerd.spec.mjs
              tests/integration/m03-product-status-workerd.spec.mjs
              tests/integration/m03-id-post-workerd.spec.mjs
              tests/integration/m07-credit-delete-workerd.spec.mjs
              tests/integration/m07-purchase-credit-delete-workerd.spec.mjs
              tests/integration/m08-reconciliation-atomic-workerd.spec.mjs
              tests/integration/m03-invoice-edit-audit-read-workerd.spec.mjs
          - group: shard-3
            specs: >-
              tests/integration/m03-settings-workerd.spec.mjs
              tests/integration/m03-transaction-contract-workerd.spec.mjs
              tests/integration/m03-authorized-post-workerd.spec.mjs
              tests/integration/m03-master-atomic-workerd.spec.mjs
              tests/integration/m05-purchase-posting-workerd.spec.mjs
              tests/integration/m07-cash-batch-workerd.spec.mjs
              tests/integration/m07-return-edit-read-workerd.spec.mjs
              tests/integration/m03-delete-log-audit-read-workerd.spec.mjs
          - group: shard-4
            specs: >-
              tests/integration/m03-m04-settings-workerd.spec.mjs
              tests/integration/m03-intent-fingerprint-workerd.spec.mjs
              tests/integration/m03-catalog-append-workerd.spec.mjs
              tests/integration/m03-m04-authorized-master-workerd.spec.mjs
              tests/integration/m06-sale-posting-workerd.spec.mjs
              tests/integration/m07-store-credit-batch-workerd.spec.mjs
              tests/integration/m07-cash-price-edit-workerd.spec.mjs
              tests/integration/m03-daybook-rpc-workerd.spec.mjs
          - group: shard-5
            specs: >-
              tests/integration/m03-m04-settings-view-workerd.spec.mjs
              tests/integration/m03-receipt-workerd.spec.mjs
              tests/integration/m02-product-unit-import-workerd.spec.mjs
              tests/integration/m03-catalog-tail-delete-workerd.spec.mjs
              tests/integration/m07-cash-return-workerd.spec.mjs
              tests/integration/m07-purchase-cash-return-workerd.spec.mjs
              tests/integration/m07-credit-price-edit-workerd.spec.mjs
              tests/integration/m03-daybook-http-workerd.spec.mjs
          - group: shard-6
            specs: >-
              tests/integration/m04-reports-bootstrap-workerd.spec.mjs
              tests/integration/m03-reversal-workerd.spec.mjs
              tests/integration/m02-product-category-import-workerd.spec.mjs
              tests/integration/m03-exactly-one-workerd.spec.mjs
              tests/integration/m07-cash-delete-workerd.spec.mjs
              tests/integration/m07-purchase-cash-delete-workerd.spec.mjs
              tests/integration/m07-quantity-preflight-workerd.spec.mjs
              tests/integration/m03-expense-category-read-workerd.spec.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned local-only Workerd test runner
        run: npm install --no-save --package-lock=false wrangler@4.161.0
      - name: Run all assigned isolated local D1 Workerd tests
        run: node --test --test-concurrency=1 ${{ matrix.specs }}

  local-worker-d1:
    name: Test read-only adapters against local workerd and D1
    runs-on: ubuntu-latest
    needs: [verify-repo, workerd-shards]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Fail unless both full Node policy and all six Workerd shards succeeded
        run: |
          test "${{ needs.verify-repo.result }}" = "success"
          test "${{ needs.workerd-shards.result }}" = "success"
