name: M04 selected Shop staff sessions (isolated two-Shop Workerd D1)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selected-shop-staff-sessions:
    name: Verify isolated business-scoped staff password/session against two local D1s
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Source, schema and hostile staff request contracts
        run: |
          npm run verify:source
          npm run docs:check
          node --test tests/m04-shop-staff-session-boundary.test.mjs tests/m04-auth-preflight.test.mjs tests/m04-staff-phone-identity.test.mjs tests/m04-auth-authority-version.test.mjs
      - name: Install local-only pinned Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.161.0
      - name: Real two Shop D1 login, cross-business denial and revoked session proofs
        run: |
          TZ=UTC node --test tests/integration/m04-shop-staff-session-two-d1-workerd.spec.mjs \
            tests/integration/m04-shop-staff-activation-two-d1-workerd.spec.mjs
