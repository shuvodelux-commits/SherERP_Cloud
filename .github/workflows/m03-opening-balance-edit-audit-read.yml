name: M03 opening balance edit audit private D1 read (local-only)

on:
  pull_request:

permissions:
  contents: read

jobs:
  local-opening-balance-audit:
    name: Verify original opening balance audit in isolated Workerd D1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Wrangler in isolated CI runner only
        run: npm install --no-save --package-lock=false wrangler@4.161.0
      - name: Test M02 immutable source import to M03 restricted read in real local D1
        run: node --test tests/integration/m03-opening-balance-edit-audit-read-workerd.spec.mjs
