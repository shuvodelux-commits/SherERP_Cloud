name: PORT-P3 first-admin ticket local Workerd D1 (no deployment)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  first-admin-ticket:
    name: Verify one-time Admin ticket and existing Google-TOTP session boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Wrangler for disposable Workerd only
        run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.161.0
      - name: Test ticket issuance on isolated Control D1
        run: node --test tests/integration/port-p3-first-admin-ticket-workerd.spec.mjs
      - name: Regression — existing Google enrollment and TOTP sessions
        run: |
          node --test \
            tests/integration/m04-platform-superadmin-bootstrap-workerd.spec.mjs \
            tests/integration/m04-platform-superadmin-session-workerd.spec.mjs
