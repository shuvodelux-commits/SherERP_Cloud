name: M02 Staging D1 local verification (no cloud writes)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-d1:
    name: Validate staging configuration and migrate local D1 only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify staging binding safety and source-code tests
        run: |
          npm test
          node scripts/check-staging-d1.mjs wrangler.staging.jsonc wrangler.preview.jsonc
      - name: Build existing frontend for isolated staging dry-run
        run: npm run build:frontend
      - name: Verify staging Worker build without deployment
        run: npx --yes wrangler@4.161.0 deploy --dry-run --config wrangler.staging.jsonc
      - name: Apply all fourteen catalog, diagnostic, archival, candidate Products, Party and auth migrations to local D1 only
        run: npx --yes wrangler@4.161.0 d1 migrations apply shererp-staging-db --local --config wrangler.staging.jsonc --persist-to "$RUNNER_TEMP/shererp-d1-local"
      - name: Inspect migrated local D1 schema without remote access
        run: |
          npx --yes wrangler@4.161.0 d1 execute shererp-staging-db --local --config wrangler.staging.jsonc --persist-to "$RUNNER_TEMP/shererp-d1-local" --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('settings','product_categories','product_units','expense_categories','legacy_error_logs','legacy_delete_log','legacy_sales_draft_audit','legacy_invoice_edit_audit','legacy_opening_balance_edit_audit','legacy_stock_lot_cost_corrections','legacy_product_snapshots','legacy_product_unit_conversion_snapshots','products','product_unit_profiles','product_unit_conversions','product_tile_measurement_revisions','parties','party_roles','party_legacy_links','party_identity_review')) AS app_tables, (SELECT COUNT(*) FROM d1_migrations) AS applied_migrations, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_party_role_delete_forbidden','trg_party_cross_source_verification','trg_party_legacy_identity_immutable','trg_party_legacy_link_delete_forbidden')) AS history_triggers, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_legacy_delete_log_immutable_update','trg_legacy_delete_log_immutable_delete')) AS delete_audit_guards, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_legacy_sales_draft_audit_immutable_update','trg_legacy_sales_draft_audit_immutable_delete')) AS draft_audit_guards, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_legacy_invoice_edit_audit_immutable_update','trg_legacy_invoice_edit_audit_immutable_delete')) AS invoice_edit_audit_guards, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_legacy_opening_balance_audit_immutable_update','trg_legacy_opening_balance_audit_immutable_delete')) AS opening_balance_audit_guards, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_legacy_stock_lot_cost_immutable_update','trg_legacy_stock_lot_cost_immutable_delete')) AS stock_lot_cost_audit_guards, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_legacy_product_snapshots_no_update','trg_legacy_product_snapshots_no_delete','trg_legacy_product_conversion_snapshots_no_update','trg_legacy_product_conversion_snapshots_no_delete')) AS product_snapshot_guards, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_products_catalog_source_provenance','trg_products_catalog_source_sealed','trg_products_catalog_first_revision','trg_products_catalog_revision_guard','trg_product_conversion_unit_review','trg_product_unit_profiles_immutable_update','trg_product_unit_profiles_immutable_delete','trg_product_unit_conversions_immutable_update','trg_product_unit_conversions_immutable_delete')) AS product_catalog_guards, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_tile_measurement_parent_pack_guard','trg_tile_measurement_immutable_update','trg_tile_measurement_immutable_delete')) AS tile_measurement_guards, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('auth_roles','auth_users','auth_legacy_credentials','auth_sessions','auth_login_throttle')) AS auth_tables, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_auth_session_no_replace','trg_auth_session_no_delete','trg_auth_session_identity_seal')) AS auth_session_guards, (SELECT COUNT(*) FROM pragma_table_info('auth_users') WHERE name IN ('source_created_by','source_created_at_iso','source_last_login_iso')) + (SELECT COUNT(*) FROM pragma_table_info('auth_roles') WHERE name='source_created_at_iso') AS provenance_columns, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_auth_user_provenance_immutable','trg_auth_role_provenance_immutable')) AS provenance_guards;" --json > "$RUNNER_TEMP/d1-local-schema.json"
          node scripts/local-d1-schema-check.mjs "$RUNNER_TEMP/d1-local-schema.json"