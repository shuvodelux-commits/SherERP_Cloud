name: M03 Owner-scoped support audit visibility (local Workerd D1)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  owner-support-audit:
    name: M03 two-Shop current Owner session and support audit D1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned disposable local Workerd
        run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.161.0
      - name: Verify current Owner support audit and existing two-Shop support grants
        run: node --test tests/integration/m03-support-owner-audit-workerd.spec.mjs tests/integration/m03-local-support-read-grants-workerd.spec.mjs tests/integration/m03-local-support-shop-diagnostics-workerd.spec.mjs
